<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPEN HACKERS AI</title>
<style>
  :root { --ink: #1c1f26; --muted: #6b7180; --line: #dcdfe5; --accent: #023015; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef0f3; color: var(--ink); font: 15px/1.6 'Malgun Gothic', '맑은 고딕', sans-serif; padding: 48px 20px; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 28px; }
  a.tool { display: block; background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 10px; padding: 18px 20px; text-decoration: none; color: inherit; margin-bottom: 12px; }
  a.tool:hover, a.tool:focus-visible { border-color: var(--accent); outline: none; }
  a.tool b { font-size: 17px; display: block; margin-bottom: 2px; }
  a.tool span { color: var(--muted); font-size: 13.5px; }
  .note { margin-top: 28px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>OPEN HACKERS AI</h1>
  <p class="sub">해커스 업무용 도구 — 로그인 없이 어느 PC에서나 열립니다.</p>
  <a class="tool" href="seatchart/">
    <b>모의고사 좌석배치표 · 안내게시물</b>
    <span>강의실별 직렬 좌석 배치(B4) + 고사장 안내게시물(A4) 출력</span>
  </a>
  <p class="note">입력한 내용은 이 PC 브라우저에만 저장됩니다. 다른 PC로 옮길 때는 도구 안의 「설정 저장」 파일을 「설정 불러오기」로 여세요.</p>
</main>
</body>
</html>
